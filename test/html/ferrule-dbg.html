<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>ferrule linux task</title>
    <script>
    // ---- file:// bootstrap: XHR shim + inline bundling (no module CORS) ----
    const realFetch=window.fetch.bind(window);
    function xhrBytes(url){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open("GET",url);x.responseType="arraybuffer";x.onload=()=>res(new Response(x.response,{headers:{"Content-Type":"application/wasm"}}));x.onerror=()=>rej(new Error("xhr failed "+url));x.send();});}
    function xhrText(url){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open("GET",url);x.onload=()=>res(x.responseText);x.onerror=()=>rej(new Error("xhr failed "+url));x.send();});}
    window.fetch=async(u)=>{const s=String(u);if(s.endsWith("wanix.ferrule.wasm")||s.endsWith("hello.elf")||s.endsWith("wanix.min.js"))return s.endsWith("wanix.min.js")?new Response(await xhrText(s)):xhrBytes(s);return realFetch(u);};
    </script>
</head>
<body>
    <pre id="status">booting</pre>
<pre id="console" style="white-space:pre-wrap"></pre>
    <wanix-namespace debug wasm="../../dist/wanix.ferrule.wasm">
        <wanix-bind dst="." src="#ramfs/new"></wanix-bind>
        <wanix-bind type="file" dst="hello.elf" src="./hello.elf"></wanix-bind>
        <wanix-task id="ferrulehello" type="linux" cmd="/hello.elf x"></wanix-task>
    </wanix-namespace>
    <script>
    function sha256(ascii){
 function rrot(v,n){return (v>>>n)|(v<<(32-n));}
 const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
 0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
 0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
 0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
 0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
 0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
 0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
 0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
 const bytes=[];for(let i=0;i<ascii.length;i++)bytes.push(ascii.charCodeAt(i)&255);
 bytes.push(0x80);while(bytes.length%64!==56)bytes.push(0);
 const bitLen=ascii.length*8;
 bytes.push(0,0,0,0,(bitLen>>>24)&255,(bitLen>>>16)&255,(bitLen>>>8)&255,bitLen&255);
 const w=new Array(64);
 for(let off=0;off<bytes.length;off+=64){
  for(let i=0;i<16;i++)w[i]=(bytes[off+4*i]<<24)|(bytes[off+4*i+1]<<16)|(bytes[off+4*i+2]<<8)|bytes[off+4*i+3];
  for(let i=16;i<64;i++){
   const s0=rrot(w[i-15],7)^rrot(w[i-15],18)^(w[i-15]>>>3);
   const s1=rrot(w[i-2],17)^rrot(w[i-2],19)^(w[i-2]>>>10);
   w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
  }
  let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
  for(let i=0;i<64;i++){
   const S1=rrot(e,6)^rrot(e,11)^rrot(e,25);
   const ch=(e&f)^(~e&g);
   const t1=(h+S1+ch+K[i]+w[i])|0;
   const S0=rrot(a,2)^rrot(a,13)^rrot(a,22);
   const maj=(a&b)^(a&c)^(b&c);
   const t2=(S0+maj)|0;
   h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
  }
  H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
  H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
 }
 return H.map(x=>("00000000"+((x>>>0).toString(16))).slice(-8)).join("");
}

    </script>
    <script>
    const status=document.getElementById("status");
    const con=document.getElementById("console");
    const origLog=console.log.bind(console),origErr=console.error.bind(console),origWarn=console.warn.bind(console);
    const emit=(tag,args)=>{try{con.textContent+=tag+" "+args.map(a=>{try{return typeof a==="string"?a:JSON.stringify(a)}catch(_){return String(a)}}).join(" ")+"\n";}catch(_){}};
    console.log=(...a)=>{emit("L",a);origLog(...a);};console.error=(...a)=>{emit("E",a);origErr(...a);};console.warn=(...a)=>{emit("W",a);origWarn(...a);};
    window.addEventListener("error",e=>emit("ERR",[e.message+"@"+e.lineno]));
    window.addEventListener("error",e=>{status.textContent="JSERROR "+(e.message||e);});
    window.addEventListener("unhandledrejection",e=>{status.textContent="REJECT "+((e.reason&&(e.reason.message||e.reason))||e);});
    function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
    async function waitFor(desc,pred,timeout=20000){
      const t0=Date.now();
      while(Date.now()-t0<timeout){ let v; try{v=await pred();}catch(_){} if(v)return v; await sleep(100); }
      throw new Error("timeout: "+desc);
    }
    (async()=>{
      const src=await xhrText("../../dist/wanix.min.js");
      try{const patched=src.replaceAll("import.meta.url",JSON.stringify(location.href)).replaceAll("import.meta",JSON.stringify(location.href));
      const blob=new Blob([patched],{type:"text/javascript"});
      await import(URL.createObjectURL(blob));
      const nsEl=document.querySelector("wanix-namespace");
      nsEl.addEventListener("error",ev=>{window.__crumb=(window.__crumb||"")+" [elerror:"+(ev.detail&&ev.detail.error&&ev.detail.error.message||ev.detail&&ev.detail.error||"?")+"]";});
      window.__t0=Date.now();
      const bb=setInterval(()=>{const k=nsEl._kernel;window.__crumb=(window.__crumb||"")+" t"+Math.round((Date.now()-window.__t0)/1000)+":k"+(k?(k.isReady?"R":"b"):"-");},2000);}catch(e){status.textContent="EVALERR "+e.message; throw e;}
      window.addEventListener("error",ev=>{if(!status.textContent.startsWith("PASS")&&!status.textContent.startsWith("FAIL"))status.textContent="LATER "+(ev.message||ev);},{once:true});
      await waitFor("elements",async()=>customElements.get("wanix-task"),15000);
      await waitFor("kernel",async()=>{const n=document.querySelector("wanix-namespace");const k=n._kernel;return k&&k.isReady;},40000).catch(async e=>{
        const n=document.querySelector("wanix-namespace");const k=n&&n._kernel;
        status.textContent="KERNELDBG "+(window.__crumb||"")+" exists="+(!!k)+" ready="+(k&&k.isReady);
        throw e;});
      const task=document.getElementById("ferrulehello");
      await waitFor("task rid",async()=>task.rid,15000);
      const path=task.path;
      await task.taskRoot.bind("/stdout.txt",path+"/fd/1");
      await task.taskRoot.bind("/stderr.txt",path+"/fd/2");
      await kernelWrite(path+"/ctl","start");
      async function kernelWrite(p,v){const k=document.querySelector("wanix-namespace")._kernel;await k.root.writeFile(p,v);}
      await waitFor("exit",async()=>{try{return (await document.querySelector("wanix-namespace")._kernel.root.readText(path+"/exit")).trim()!=="";}catch(_){return false;}},30000);
      const k=document.querySelector("wanix-namespace")._kernel;
      const exit=parseInt((await k.root.readText(path+"/exit")).trim(),10);
      const stdout=await k.root.readText("/stdout.txt");
      let stderr="";try{stderr=await k.root.readText("/stderr.txt");}catch(_){}
      let fileText="";try{fileText=await k.root.readText("/out.txt");}catch(_){}
      const result={exit,stdout,err:stderr,file:fileText,ok:exit===7&&stdout==="hello argc=2 prog=hello\n"&&stderr===""&&fileText==="ferrule file effect\n"};
      const digestHex=sha256(JSON.stringify(result));
      status.textContent=(result.ok?"PASS":"FAIL")+" digest="+digestHex+" exit="+exit+" stdout="+JSON.stringify(stdout)+" stderr="+JSON.stringify(stderr)+" file="+JSON.stringify(fileText);
      const bits=[];for(const pair of digestHex.match(/../g))bits.push(parseInt(pair,16));
      const grid=document.createElement("div");
      grid.style.cssText="position:fixed;left:20px;top:60px;width:160px;height:160px;background:#fff;";
      for(const byte of bits)for(let i=7;i>=0;i--){
        const c=document.createElement("div");
        c.style.cssText=`width:10px;height:10px;float:left;background:${(byte>>i)&1?"#000":"#fff"};`;
        grid.appendChild(c);
      }
      document.body.appendChild(grid);
    })().catch(e=>{status.textContent=(status.textContent.startsWith("KERNELDBG")?status.textContent+" | ":"")+"ERROR "+(e&&e.message||e);});
    </script>
</body>
</html>
